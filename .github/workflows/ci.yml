name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install MoonBit
        uses: hustcer/setup-moonbit@v1
        with:
          version: "0.10.11+6ff76a5f9"
          core-version: "0.10.11+6ff76a5f9"

      - name: Show toolchain
        run: moon version --all

      - name: Resolve pinned dependencies
        run: moon update

      - name: Check formatting
        run: moon fmt --check

      - name: Type check
        run: moon check --deny-warn

      - name: Build all targets
        run: moon build --target all

      - name: Run tests
        run: moon test

      - name: Smoke-test examples
        run: |
          moon run cmd/main -- audit examples/audit/context.md \
            --policy examples/audit/policy.json
          moon run cmd/main -- audit examples/audit/context.md \
            --policy examples/audit/policy.json \
            --json \
            --report "$RUNNER_TEMP/context-audit.json"
          test -s "$RUNNER_TEMP/context-audit.json"
